# Linker config for NESLib on plain NROM (no cartridge RAM needed).
# CPU RAM map:
#   $0000-$00FF zero page   (NESLib uses a chunk of it)
#   $0100-$01FF CPU stack + NESLib palette buffer ($01C0)
#   $0200-$02FF sprite (OAM) buffer
#   $0300-$07FF your variables (BSS/DATA) + C parameter stack growing down from $0800
#   $6000-$7FFF battery-backed save RAM (high scores) -- only if the cartridge has it
SYMBOLS {
    NES_MAPPER:    type = weak, value = 0;   # NROM
    NES_PRG_BANKS: type = weak, value = 2;   # 32 KB PRG
    NES_CHR_BANKS: type = weak, value = 1;   # 8 KB CHR
    NES_MIRRORING: type = weak, value = 1;   # vertical (fine for single-screen games)
    NES_BATTERY:   type = weak, value = 1;   # 8 KB battery-backed RAM at $6000 (high scores)
}
MEMORY {
    ZP:     file = "", start = $0002, size = $00FE, type = rw, define = yes;
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    ROM0:   file = %O, start = $8000, size = $7FFA, fill = yes, define = yes;
    ROMV:   file = %O, start = $FFFA, size = $0006, fill = yes;
    ROM2:   file = %O, start = $0000, size = $2000, fill = yes;
    RAM:    file = "", start = $0300, size = $0500, define = yes;
    SRAM:   file = "", start = $6000, size = $2000, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,              type = zp;
    HEADER:   load = HEADER,          type = ro;
    STARTUP:  load = ROM0,            type = ro,  define   = yes;
    LOWCODE:  load = ROM0,            type = ro,  optional = yes;
    ONCE:     load = ROM0,            type = ro,  optional = yes;
    CODE:     load = ROM0,            type = ro,  define   = yes;
    RODATA:   load = ROM0,            type = ro,  define   = yes;
    DATA:     load = ROM0, run = RAM, type = rw,  define   = yes;
    VECTORS:  load = ROMV,            type = rw;
    CHARS:    load = ROM2,            type = rw;
    BSS:      load = RAM,             type = bss, define   = yes;
    SAVE:     load = SRAM,            type = bss, optional = yes;   # battery RAM: never cleared at boot
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
